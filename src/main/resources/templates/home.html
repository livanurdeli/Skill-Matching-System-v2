<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SkillMatch - İş İlanları</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div id="current-user-id" th:attr="data-id=${user.id}" style="display:none"></div>

<!-- NAVBAR -->
<nav class="navbar">
    <a th:href="@{/home}" class="nav-logo">
        <div class="nav-logo-icon">⚡</div>
        <span class="nav-logo-text">SkillMatch</span>
    </a>
    <div class="nav-center">
        <div class="nav-center-dot"></div>
        <span>Merhaba, <strong th:text="${user.name}"></strong></span>
    </div>
    <div class="nav-right">
        <div id="msg-notif" class="msg-notif-badge" style="display:none" onclick="openLastChat()">
            💬 <span id="msg-notif-count">0</span> yeni mesaj
        </div>
        <a th:href="@{/logout}" class="nav-logout">Çıkış Yap</a>
    </div>
</nav>

<div class="page">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-card">
            <div class="card-label">Profil</div>
            <div class="user-avatar">🎯</div>
            <div class="user-name" th:text="${user.name}"></div>
            <div style="margin-top:6px">
                <div class="user-role-tag"><span>Job Seeker</span></div>
            </div>
        </div>
        <div class="sidebar-card">
            <div class="card-label">Yeteneklerim</div>
            <div th:if="${user.skills.isEmpty()}" class="no-skills">Henüz yetenek eklemediniz.</div>
            <div class="skills-wrap" th:if="${!user.skills.isEmpty()}">
                <span class="skill-tag" th:each="skill : ${user.skills}" th:text="${skill.name}"></span>
            </div>
        </div>
        <div class="sidebar-card">
            <div class="card-label">Özet</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-num" th:text="${jobMatchMap.size()}">0</div>
                    <div class="stat-lbl">Toplam ilan</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" th:text="${highMatchCount != null ? highMatchCount : '-'}">-</div>
                    <div class="stat-lbl">%70+ eşleşme</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <div class="main-header">
            <h1>İş İlanları</h1>
            <p th:text="${jobMatchMap.size()} + ' ilan bulundu, yeteneklerinize göre sıralandı'"></p>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterCards('all', this)">Tümü</button>
            <button class="filter-btn" onclick="filterCards('high', this)">🟢 Yüksek Eşleşme</button>
            <button class="filter-btn" onclick="filterCards('medium', this)">🟡 Orta Eşleşme</button>
            <button class="filter-btn" onclick="filterCards('low', this)">🔴 Düşük Eşleşme</button>
        </div>

        <div th:if="${jobMatchMap.isEmpty()}" class="empty-state">
            <div>📋</div>
            <p>Henüz iş ilanı bulunmuyor.</p>
        </div>

        <!-- İŞ KARTLARI -->
        <div th:each="entry : ${jobMatchMap}"
             th:with="job=${entry.key}, score=${entry.value}"
             th:classappend="${score >= 70 ? 'high' : (score >= 40 ? 'medium' : 'low')}"
             th:attr="data-level=${score >= 70 ? 'high' : (score >= 40 ? 'medium' : 'low')}"
             class="job-card">

            <div class="job-top">
                <div>
                    <div class="job-title"  th:text="${job.title}"></div>
                    <div class="job-company" th:text="${job.company} + ' · ' + ${job.location}"></div>
                </div>
                <div class="match-badge"
                     th:classappend="${score >= 70 ? 'match-high' : (score >= 40 ? 'match-medium' : 'match-low')}">
                    <span class="match-pct" th:text="${#numbers.formatDecimal(score,1,1)} + '%'"></span>
                    <span class="match-label">uygunluk</span>
                </div>
            </div>

            <div class="score-bar-wrap">
                <div class="score-bar-track">
                    <div class="score-bar-fill" th:style="'width:' + ${score} + '%'"></div>
                </div>
            </div>

            <div class="job-desc" th:text="${job.description}"></div>

            <div class="req-label">Aranan Yetenekler</div>
            <div class="req-skills">
                <th:block th:each="skill : ${job.requiredSkills}"
                          th:with="hasSkill=${user.skills.contains(skill)}">
                    <span class="req-skill"
                          th:classappend="${hasSkill ? 'matched' : 'missing'}"
                          th:text="${skill.name}"></span>
                </th:block>
            </div>

            <!-- BAŞVUR + CHAT -->
            <div style="margin-top: 1.2rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">

                <form th:if="${!appliedJobIds.contains(job.id)}"
                      method="post"
                      th:action="@{/apply/{id}(id=${job.id})}">
                    <button type="submit" class="apply-btn">Başvur →</button>
                </form>

                <th:block th:if="${appliedJobIds.contains(job.id)}">
                    <span class="applied-badge">✓ Başvuruldu</span>
                    <button class="chat-btn"
                            th:attr="data-appid=${appliedJobApplicationMap[job.id]},data-name=${job.title}"
                            onclick="openChat(this)">
                        💬 Mesaj
                    </button>
                </th:block>

            </div>

        </div>

    </main>
</div>

<!-- CHAT DRAWER -->
<div class="chat-overlay" id="chat-overlay" onclick="closeChat()"></div>

<div class="chat-drawer" id="chat-drawer">
    <div class="drawer-header">
        <div>
            <div class="drawer-header-sub">Mesajlaşma</div>
            <div class="drawer-header-name" id="chat-title">—</div>
        </div>
        <button class="drawer-close" onclick="closeChat()">✕</button>
    </div>
    <div id="chat-messages"></div>
    <div class="drawer-input-wrap">
        <input id="chat-input" type="text" placeholder="Mesaj yazın..."
               onkeydown="if(event.key==='Enter') sendMsg()"/>
        <button class="send-btn" onclick="sendMsg()">Gönder</button>
    </div>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
