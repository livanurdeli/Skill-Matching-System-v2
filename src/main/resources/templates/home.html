<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SkillMatch - İş İlanları</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: #080c14;
            font-family: 'DM Sans', Arial, sans-serif;
            color: #f0f4f8;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 50% 40% at 5% 0%, rgba(94,234,212,0.06) 0%, transparent 55%),
                radial-gradient(ellipse 40% 50% at 95% 100%, rgba(125,211,252,0.04) 0%, transparent 55%);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: ''; position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
            background-size: 72px 72px;
            pointer-events: none; z-index: 0;
        }

        /* ── NAVBAR ── */
        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8,12,20,0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            padding: 0 2.5rem;
            display: flex; align-items: center; justify-content: space-between;
            height: 62px;
        }
        .nav-logo { display: flex; align-items: center; gap: 9px; text-decoration: none; }
        .nav-logo-icon {
            width: 30px; height: 30px; border-radius: 8px;
            background: linear-gradient(135deg, #5EEAD4, #7DD3FC);
            display: flex; align-items: center; justify-content: center; font-size: 15px;
        }
        .nav-logo-text { font-family: 'Fraunces', serif; font-size: 1.05rem; font-weight: 600; color: #fff; }
        .nav-center {
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 100px; padding: 5px 16px;
        }
        .nav-center-dot { width: 5px; height: 5px; border-radius: 50%; background: #5EEAD4; box-shadow: 0 0 6px #5EEAD4; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
        .nav-center span { font-size: 12px; color: rgba(255,255,255,0.45); letter-spacing: 0.5px; }
        .nav-center strong { color: #fff; font-weight: 500; }
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .nav-logout {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 14px; border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.5); font-size: 13px;
            text-decoration: none; transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
        }
        .nav-logout:hover { background: rgba(255,255,255,0.09); color: #fff; }

        /* ── NOTIF ── */
        .msg-notif-badge {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 14px; border-radius: 8px;
            background: rgba(94,234,212,0.1);
            border: 1px solid rgba(94,234,212,0.25);
            color: #5EEAD4; font-size: 13px; font-weight: 500;
            cursor: pointer; animation: pulse-notif 2s ease-in-out infinite;
        }
        @keyframes pulse-notif { 0%,100%{opacity:1} 50%{opacity:0.6} }

        /* ── LAYOUT ── */
        .page {
            position: relative; z-index: 1;
            max-width: 1100px; margin: 0 auto;
            padding: 2.5rem 2rem;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.75rem;
            align-items: start;
        }

        /* ── SIDEBAR ── */
        .sidebar { display: flex; flex-direction: column; gap: 1rem; position: sticky; top: 80px; }
        .sidebar-card {
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px; padding: 1.5rem;
            opacity: 0; transform: translateY(12px);
            animation: fadeUp 0.5s ease forwards;
        }
        .sidebar-card:nth-child(1) { animation-delay: 0.08s; }
        .sidebar-card:nth-child(2) { animation-delay: 0.15s; }
        .sidebar-card:nth-child(3) { animation-delay: 0.22s; }
        .card-label {
            font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;
            color: rgba(255,255,255,0.3); font-weight: 500; margin-bottom: 14px;
        }
        .user-avatar {
            width: 48px; height: 48px; border-radius: 12px;
            background: linear-gradient(135deg, rgba(94,234,212,0.3), rgba(125,211,252,0.2));
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; margin-bottom: 12px;
        }
        .user-name { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 600; color: #fff; margin-bottom: 2px; }
        .user-role-tag {
            display: inline-flex; align-items: center; gap: 5px;
            background: rgba(94,234,212,0.08); border: 1px solid rgba(94,234,212,0.2);
            border-radius: 100px; padding: 2px 9px;
        }
        .user-role-tag span { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: #5EEAD4; font-weight: 500; }
        .skills-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
        .skill-tag {
            display: inline-flex; align-items: center;
            background: rgba(94,234,212,0.07);
            border: 1px solid rgba(94,234,212,0.18);
            border-radius: 100px; padding: 4px 11px;
            font-size: 12px; color: rgba(255,255,255,0.7);
        }
        .no-skills { font-size: 13px; color: rgba(255,255,255,0.25); font-style: italic; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-box {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px; padding: 10px 12px;
        }
        .stat-num { font-family: 'Fraunces', serif; font-size: 1.35rem; font-weight: 600; color: #5EEAD4; }
        .stat-lbl { font-size: 11px; color: rgba(255,255,255,0.3); font-weight: 300; }

        /* ── MAIN ── */
        .main { display: flex; flex-direction: column; gap: 1rem; }
        .main-header {
            opacity: 0; transform: translateY(12px);
            animation: fadeUp 0.5s ease 0.05s forwards;
            margin-bottom: 0.5rem;
        }
        .main-header h1 { font-family: 'Fraunces', serif; font-size: 1.6rem; font-weight: 600; color: #fff; letter-spacing: -0.5px; }
        .main-header p { font-size: 13.5px; color: rgba(255,255,255,0.35); font-weight: 300; margin-top: 4px; }
        .filter-bar {
            display: flex; gap: 8px; flex-wrap: wrap;
            opacity: 0; animation: fadeUp 0.5s ease 0.12s forwards;
        }
        .filter-btn {
            padding: 7px 16px; border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.45); font-size: 13px;
            font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s;
        }
        .filter-btn:hover { border-color: rgba(94,234,212,0.3); color: rgba(255,255,255,0.8); }
        .filter-btn.active { background: rgba(94,234,212,0.1); border-color: rgba(94,234,212,0.35); color: #5EEAD4; font-weight: 500; }

        /* ── JOB CARD ── */
        .job-card {
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px; padding: 1.75rem;
            position: relative; overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            opacity: 0; transform: translateY(14px);
            animation: fadeUp 0.5s ease forwards;
        }
        .job-card:hover { border-color: rgba(255,255,255,0.14); transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
        .job-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 3px 0 0 3px; }
        .job-card.high::before   { background: linear-gradient(to bottom, #22c55e, #4ade80); }
        .job-card.medium::before { background: linear-gradient(to bottom, #f59e0b, #fbbf24); }
        .job-card.low::before    { background: linear-gradient(to bottom, #ef4444, #f87171); }
        .job-card.high:hover   { box-shadow: 0 12px 40px rgba(34,197,94,0.08); }
        .job-card.medium:hover { box-shadow: 0 12px 40px rgba(245,158,11,0.08); }
        .job-card.low:hover    { box-shadow: 0 12px 40px rgba(239,68,68,0.06); }
        .job-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 1rem; }
        .job-title { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 600; color: #fff; letter-spacing: -0.3px; margin-bottom: 4px; }
        .job-company { font-size: 13px; color: rgba(255,255,255,0.38); font-weight: 300; }
        .match-badge { display: flex; flex-direction: column; align-items: center; padding: 8px 14px; border-radius: 12px; flex-shrink: 0; min-width: 80px; }
        .match-badge.match-high   { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.25); }
        .match-badge.match-medium { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25); }
        .match-badge.match-low    { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); }
        .match-pct { font-family: 'Fraunces', serif; font-size: 1.35rem; font-weight: 700; line-height: 1; }
        .match-badge.match-high   .match-pct { color: #22c55e; }
        .match-badge.match-medium .match-pct { color: #f59e0b; }
        .match-badge.match-low    .match-pct { color: #ef4444; }
        .match-label { font-size: 10px; color: rgba(255,255,255,0.3); font-weight: 300; margin-top: 2px; }
        .score-bar-wrap { margin-bottom: 14px; }
        .score-bar-track { height: 3px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
        .score-bar-fill  { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
        .high   .score-bar-fill { background: linear-gradient(90deg, #22c55e, #4ade80); }
        .medium .score-bar-fill { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .low    .score-bar-fill { background: linear-gradient(90deg, #ef4444, #f87171); }
        .job-desc { font-size: 13.5px; color: rgba(255,255,255,0.4); line-height: 1.65; font-weight: 300; margin-bottom: 14px; }
        .req-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.25); font-weight: 500; margin-bottom: 8px; }
        .req-skills { display: flex; flex-wrap: wrap; gap: 6px; }
        .req-skill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 100px; font-size: 12px; }
        .req-skill.matched { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.25);  color: #4ade80; }
        .req-skill.missing { background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.18);  color: rgba(255,255,255,0.35); }
        .req-skill.matched::before { content: '✓'; font-size: 10px; }
        .req-skill.missing::before { content: '✗'; font-size: 10px; color: rgba(239,68,68,0.5); }

        /* ── BAŞVUR & CHAT ── */
        .apply-btn {
            padding: 8px 20px; border-radius: 100px; border: none;
            background: linear-gradient(135deg, #5EEAD4, #7DD3FC);
            color: #071a2e; font-size: 13px; font-weight: 600;
            font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s;
        }
        .apply-btn:hover { transform: translateY(-1px); opacity: 0.88; }
        .applied-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 14px; border-radius: 100px;
            background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25);
            color: #4ade80; font-size: 13px; font-weight: 500;
        }
        .chat-btn {
            background: rgba(94,234,212,0.08);
            border: 1px solid rgba(94,234,212,0.2);
            border-radius: 100px; color: #5EEAD4;
            padding: 8px 16px; cursor: pointer;
            font-size: 13px; font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
        }
        .chat-btn:hover { background: rgba(94,234,212,0.15); transform: translateY(-1px); }

        /* ── CHAT DRAWER ── */
        .chat-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
            z-index: 200;
        }
        .chat-drawer {
            display: none; position: fixed; top: 0; right: 0; bottom: 0;
            width: 400px; background: #0d1526;
            border-left: 1px solid rgba(255,255,255,0.08);
            z-index: 201; flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .chat-drawer.open { transform: translateX(0); }
        .drawer-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.02);
        }
        .drawer-header-sub  { font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
        .drawer-header-name { font-family: 'Fraunces', serif; font-size: 1.1rem; color: #fff; }
        .drawer-close {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: rgba(255,255,255,0.5);
            padding: 6px 11px; cursor: pointer; font-size: 14px; transition: all 0.2s;
        }
        .drawer-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
        #chat-messages {
            flex: 1; overflow-y: auto; padding: 1.2rem;
            display: flex; flex-direction: column; gap: 10px;
            scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
        }
        .msg-bubble-wrap { display: flex; flex-direction: column; }
        .msg-bubble-wrap.mine  { align-items: flex-end; }
        .msg-bubble-wrap.other { align-items: flex-start; }
        .msg-bubble {
            max-width: 78%; padding: 9px 13px; border-radius: 14px;
            font-size: 13.5px; line-height: 1.5; color: #f0f4f8;
        }
        .msg-bubble.mine  {
            background: linear-gradient(135deg, rgba(94,234,212,0.18), rgba(125,211,252,0.15));
            border: 1px solid rgba(94,234,212,0.2); border-bottom-right-radius: 4px;
        }
        .msg-bubble.other {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08); border-bottom-left-radius: 4px;
        }
        .msg-meta { font-size: 10px; color: rgba(255,255,255,0.22); margin-top: 3px; }
        .chat-empty { text-align: center; padding: 3rem 1rem; font-size: 13px; color: rgba(255,255,255,0.2); font-style: italic; }
        .drawer-input-wrap {
            padding: 1rem 1.2rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex; gap: 8px;
        }
        #chat-input {
            flex: 1; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
            padding: 10px 14px; color: #fff; font-size: 13px;
            font-family: 'DM Sans', sans-serif; outline: none; transition: border 0.2s;
        }
        #chat-input:focus { border-color: rgba(94,234,212,0.35); }
        #chat-input::placeholder { color: rgba(255,255,255,0.25); }
        .send-btn {
            padding: 10px 18px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #5EEAD4, #7DD3FC);
            color: #071a2e; font-weight: 600; cursor: pointer; font-size: 13px;
            font-family: 'DM Sans', sans-serif; transition: all 0.2s;
        }
        .send-btn:hover { opacity: 0.88; }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center; padding: 4rem 2rem;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.07);
            border-radius: 18px; color: rgba(255,255,255,0.25);
            opacity: 0; animation: fadeUp 0.5s ease 0.2s forwards;
        }
        .empty-state div { font-size: 3rem; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
        @media (max-width: 800px) { .page { grid-template-columns: 1fr; } .sidebar { position: static; } }
        @media (max-width: 500px) { .navbar { padding: 0 1rem; } .nav-center { display: none; } .page { padding: 1.5rem 1rem; } .chat-drawer { width: 100%; } }
    </style>
</head>
<body>

<div id="current-user-id" th:attr="data-id=${user.id}" style="display:none"></div>

<!-- NAVBAR -->
<nav class="navbar">
    <a th:href="@{/home}" class="nav-logo">
        <div class="nav-logo-icon">⚡</div>
        <span class="nav-logo-text">SkillMatch</span>
    </a>
    <div class="nav-center">
        <div class="nav-center-dot"></div>
        <span>Merhaba, <strong th:text="${user.name}"></strong></span>
    </div>
    <div class="nav-right">
        <div id="msg-notif" class="msg-notif-badge" style="display:none" onclick="openLastChat()">
            💬 <span id="msg-notif-count">0</span> yeni mesaj
        </div>
        <a th:href="@{/logout}" class="nav-logout">Çıkış Yap</a>
    </div>
</nav>

<div class="page">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-card">
            <div class="card-label">Profil</div>
            <div class="user-avatar">🎯</div>
            <div class="user-name" th:text="${user.name}"></div>
            <div style="margin-top:6px">
                <div class="user-role-tag"><span>Job Seeker</span></div>
            </div>
        </div>
        <div class="sidebar-card">
            <div class="card-label">Yeteneklerim</div>
            <div th:if="${user.skills.isEmpty()}" class="no-skills">Henüz yetenek eklemediniz.</div>
            <div class="skills-wrap" th:if="${!user.skills.isEmpty()}">
                <span class="skill-tag" th:each="skill : ${user.skills}" th:text="${skill.name}"></span>
            </div>
        </div>
        <div class="sidebar-card">
            <div class="card-label">Özet</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-num" th:text="${jobMatchMap.size()}">0</div>
                    <div class="stat-lbl">Toplam ilan</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" th:text="${highMatchCount != null ? highMatchCount : '-'}">-</div>
                    <div class="stat-lbl">%70+ eşleşme</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <div class="main-header">
            <h1>İş İlanları</h1>
            <p th:text="${jobMatchMap.size()} + ' ilan bulundu, yeteneklerinize göre sıralandı'"></p>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterCards('all', this)">Tümü</button>
            <button class="filter-btn" onclick="filterCards('high', this)">🟢 Yüksek Eşleşme</button>
            <button class="filter-btn" onclick="filterCards('medium', this)">🟡 Orta Eşleşme</button>
            <button class="filter-btn" onclick="filterCards('low', this)">🔴 Düşük Eşleşme</button>
        </div>

        <div th:if="${jobMatchMap.isEmpty()}" class="empty-state">
            <div>📋</div>
            <p>Henüz iş ilanı bulunmuyor.</p>
        </div>

        <!-- İŞ KARTLARI -->
        <div th:each="entry : ${jobMatchMap}"
             th:with="job=${entry.key}, score=${entry.value}"
             th:classappend="${score >= 70 ? 'high' : (score >= 40 ? 'medium' : 'low')}"
             th:attr="data-level=${score >= 70 ? 'high' : (score >= 40 ? 'medium' : 'low')}"
             class="job-card">

            <div class="job-top">
                <div>
                    <div class="job-title"  th:text="${job.title}"></div>
                    <div class="job-company" th:text="${job.company} + ' · ' + ${job.location}"></div>
                </div>
                <div class="match-badge"
                     th:classappend="${score >= 70 ? 'match-high' : (score >= 40 ? 'match-medium' : 'match-low')}">
                    <span class="match-pct" th:text="${#numbers.formatDecimal(score,1,1)} + '%'"></span>
                    <span class="match-label">uygunluk</span>
                </div>
            </div>

            <div class="score-bar-wrap">
                <div class="score-bar-track">
                    <div class="score-bar-fill" th:style="'width:' + ${score} + '%'"></div>
                </div>
            </div>

            <div class="job-desc" th:text="${job.description}"></div>

            <div class="req-label">Aranan Yetenekler</div>
            <div class="req-skills">
                <th:block th:each="skill : ${job.requiredSkills}"
                          th:with="hasSkill=${user.skills.contains(skill)}">
                    <span class="req-skill"
                          th:classappend="${hasSkill ? 'matched' : 'missing'}"
                          th:text="${skill.name}"></span>
                </th:block>
            </div>

            <!-- BAŞVUR + CHAT -->
            <div style="margin-top: 1.2rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">

                <form th:if="${!appliedJobIds.contains(job.id)}"
                      method="post"
                      th:action="@{/apply/{id}(id=${job.id})}">
                    <button type="submit" class="apply-btn">Başvur →</button>
                </form>

                <th:block th:if="${appliedJobIds.contains(job.id)}">
                    <span class="applied-badge">✓ Başvuruldu</span>
                    <button class="chat-btn"
                            th:attr="data-appid=${appliedJobApplicationMap[job.id]},data-name=${job.title}"
                            onclick="openChat(this)">
                        💬 Mesaj
                    </button>
                </th:block>

            </div>

        </div>

    </main>
</div>

<!-- CHAT DRAWER -->
<div class="chat-overlay" id="chat-overlay" onclick="closeChat()"></div>

<div class="chat-drawer" id="chat-drawer">
    <div class="drawer-header">
        <div>
            <div class="drawer-header-sub">Mesajlaşma</div>
            <div class="drawer-header-name" id="chat-title">—</div>
        </div>
        <button class="drawer-close" onclick="closeChat()">✕</button>
    </div>
    <div id="chat-messages"></div>
    <div class="drawer-input-wrap">
        <input id="chat-input" type="text" placeholder="Mesaj yazın..."
               onkeydown="if(event.key==='Enter') sendMsg()"/>
        <button class="send-btn" onclick="sendMsg()">Gönder</button>
    </div>
</div>

<script>
    var currentUserId = parseInt(document.getElementById('current-user-id').getAttribute('data-id'));
    var currentAppId  = null;

    function loadUnreadCount() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/chat/unread-count', true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                var data  = JSON.parse(xhr.responseText);
                var badge = document.getElementById('msg-notif');
                if (data.count > 0) {
                    document.getElementById('msg-notif-count').textContent = data.count;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            }
        };
        xhr.send();
    }

    loadUnreadCount();
    setInterval(loadUnreadCount, 30000);

    function openChat(btn) {
        currentAppId = btn.getAttribute('data-appid');
        document.getElementById('chat-title').textContent = btn.getAttribute('data-name');
        document.getElementById('chat-overlay').style.display = 'block';
        var drawer = document.getElementById('chat-drawer');
        drawer.style.display = 'flex';
        drawer.classList.add('open');
        loadMessages();
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/chat/' + currentAppId + '/read', true);
        xhr.onload = function() { loadUnreadCount(); };
        xhr.send();
    }

    function closeChat() {
        var drawer = document.getElementById('chat-drawer');
        drawer.classList.remove('open');
        drawer.style.display = 'none';
        document.getElementById('chat-overlay').style.display = 'none';
        currentAppId = null;
    }

    function loadMessages() {
        var box = document.getElementById('chat-messages');
        box.textContent = '';
        var loading = document.createElement('div');
        loading.className = 'chat-empty';
        loading.textContent = 'Yükleniyor...';
        box.appendChild(loading);

        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/chat/' + currentAppId + '/messages', true);
        xhr.onload = function() {
            box.textContent = '';
            if (xhr.status === 200) {
                var msgs = JSON.parse(xhr.responseText);
                if (msgs.length === 0) {
                    var empty = document.createElement('div');
                    empty.className = 'chat-empty';
                    empty.textContent = 'Henüz mesaj yok. İlk mesajı siz gönderin! 👋';
                    box.appendChild(empty);
                } else {
                    for (var i = 0; i < msgs.length; i++) {
                        appendMessage(msgs[i]);
                    }
                    box.scrollTop = box.scrollHeight;
                }
            } else {
                var err = document.createElement('div');
                err.className = 'chat-empty';
                err.textContent = 'Mesajlar yüklenemedi.';
                box.appendChild(err);
            }
        };
        xhr.send();
    }

    function appendMessage(m) {
        var box    = document.getElementById('chat-messages');
        var isMine = (m.senderId == currentUserId);
        var wrap   = document.createElement('div');
        wrap.className = 'msg-bubble-wrap ' + (isMine ? 'mine' : 'other');
        var bubble = document.createElement('div');
        bubble.className = 'msg-bubble ' + (isMine ? 'mine' : 'other');
        bubble.textContent = m.content;
        var meta = document.createElement('div');
        meta.className = 'msg-meta';
        var time = m.sentAt ? m.sentAt.substring(11, 16) : '';
        meta.textContent = m.senderName + ' · ' + time;
        wrap.appendChild(bubble);
        wrap.appendChild(meta);
        box.appendChild(wrap);
    }

    function sendMsg() {
        var input   = document.getElementById('chat-input');
        var content = input.value.trim();
        if (!content || !currentAppId) return;
        input.value = '';

        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/chat/' + currentAppId + '/send', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.onload = function() {
            if (xhr.status === 200) {
                var msg = JSON.parse(xhr.responseText);
                var box = document.getElementById('chat-messages');
                var empty = box.querySelector('.chat-empty');
                if (empty) empty.remove();
                appendMessage(msg);
                box.scrollTop = box.scrollHeight;
            }
        };
        xhr.send(JSON.stringify({ content: content }));
    }

    function filterCards(level, btn) {
        var btns = document.querySelectorAll('.filter-btn');
        for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
        btn.classList.add('active');
        var cards = document.querySelectorAll('.job-card');
        for (var j = 0; j < cards.length; j++) {
            cards[j].style.display = (level === 'all' || cards[j].getAttribute('data-level') === level) ? '' : 'none';
        }
    }

    window.onload = function() {
        var bars = document.querySelectorAll('.score-bar-fill');
        for (var i = 0; i < bars.length; i++) {
            var w = bars[i].style.width;
            bars[i].style.width = '0%';
            (function(bar, width) {
                setTimeout(function() { bar.style.width = width; }, 200);
            })(bars[i], w);
        }
    };
    function openLastChat() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/chat/last-application', true);
    xhr.onload = function() {
        if (xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            if (data.appId) {
                currentAppId = data.appId;
                document.getElementById('chat-title').textContent = data.name;
                document.getElementById('chat-overlay').style.display = 'block';
                var drawer = document.getElementById('chat-drawer');
                drawer.style.display = 'flex';
                drawer.classList.add('open');
                loadMessages();
                var xhr2 = new XMLHttpRequest();
                xhr2.open('POST', '/chat/' + currentAppId + '/read', true);
                xhr2.onload = function() { loadUnreadCount(); };
                xhr2.send();
            }
        }
    };
    xhr.send();
}
</script>

</body>
</html>
