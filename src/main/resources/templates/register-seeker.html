<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SkillMatch - Kayıt Ol</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: #080c14;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            font-family: 'DM Sans', Arial, sans-serif;
            padding: 3rem 1rem;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 55% 45% at 10% 15%, rgba(94,234,212,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 50% 55% at 90% 85%, rgba(125,211,252,0.05) 0%, transparent 60%);
            pointer-events: none;
        }
        body::after {
            content: ''; position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 72px 72px;
            pointer-events: none;
        }

        .page-wrap {
            position: relative; z-index: 10;
            width: 100%; max-width: 580px;
            display: flex; flex-direction: column; gap: 0;
        }

        /* ── Header ── */
        .page-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 2rem;
            opacity: 0; transform: translateY(12px);
            animation: fadeUp 0.5s ease 0.05s forwards;
        }
        .logo { display: flex; align-items: center; gap: 9px; text-decoration: none; }
        .logo-icon {
            width: 32px; height: 32px; border-radius: 9px;
            background: linear-gradient(135deg, #5EEAD4, #7DD3FC);
            display: flex; align-items: center; justify-content: center; font-size: 16px;
        }
        .logo-text { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 600; color: #fff; }

        .step-indicator {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; color: rgba(255,255,255,0.3); font-weight: 300;
        }
        .step-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255,255,255,0.15);
        }
        .step-dot.active { background: #5EEAD4; box-shadow: 0 0 6px #5EEAD4; }

        /* ── Card ── */
        .card {
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            overflow: hidden;
            opacity: 0; transform: translateY(16px);
            animation: fadeUp 0.55s ease 0.12s forwards;
        }

        .card-header {
            padding: 2.25rem 2.25rem 0;
        }
        .role-tag {
            display: inline-flex; align-items: center; gap: 7px;
            background: rgba(94,234,212,0.08);
            border: 1px solid rgba(94,234,212,0.2);
            border-radius: 100px; padding: 4px 12px 4px 8px;
            margin-bottom: 1rem;
        }
        .role-tag-dot { width: 5px; height: 5px; border-radius: 50%; background: #5EEAD4; }
        .role-tag span { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #5EEAD4; font-weight: 500; }

        .card-header h1 {
            font-family: 'Fraunces', serif;
            font-size: 1.8rem; font-weight: 600; color: #fff;
            letter-spacing: -0.5px; margin-bottom: 6px;
        }
        .card-header p { font-size: 13.5px; color: rgba(255,255,255,0.38); font-weight: 300; }

        /* Progress bar */
        .progress-bar {
            height: 2px;
            background: rgba(255,255,255,0.05);
            margin-top: 1.75rem;
            position: relative; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #5EEAD4, #7DD3FC);
            transition: width 0.4s ease;
        }

        /* ── Form body ── */
        .card-body { padding: 2rem 2.25rem 2.25rem; }

        /* Error */
        .error {
            display: flex; align-items: center; gap: 10px;
            background: rgba(248,113,113,0.08);
            border: 1px solid rgba(248,113,113,0.2);
            border-radius: 10px; padding: 11px 14px;
            margin-bottom: 1.5rem;
            font-size: 13.5px; color: #fca5a5; font-weight: 300;
        }
        .error::before { content: '⚠'; }

        form { display: flex; flex-direction: column; gap: 1rem; }

        /* Section titles */
        .section-title {
            font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
            color: rgba(255,255,255,0.35); font-weight: 500;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-top: 0.5rem;
        }

        /* Field */
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.45); letter-spacing: 0.5px; text-transform: uppercase; }

        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 13px; font-size: 15px; color: rgba(255,255,255,0.22); pointer-events: none; transition: color 0.25s; }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 12px 12px 40px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 11px;
            color: #f0f4f8; font-size: 14px;
            font-family: 'DM Sans', Arial, sans-serif; font-weight: 300;
            outline: none; transition: all 0.25s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: rgba(94,234,212,0.45);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 0 3px rgba(94,234,212,0.06);
        }
        .input-wrap:focus-within .input-icon { color: #5EEAD4; }
        input::placeholder { color: rgba(255,255,255,0.16); }

        /* Two-col layout */
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        /* ── Skills grid ── */
        .skills-section { display: flex; flex-direction: column; gap: 10px; }
        .skills-search {
            position: relative; display: flex; align-items: center;
        }
        .skills-search input {
            padding-left: 38px !important;
            background: rgba(255,255,255,0.03) !important;
        }
        .skills-search .input-icon { left: 12px; }

        .skills-counter {
            position: absolute; right: 12px;
            font-size: 11.5px; color: rgba(255,255,255,0.3); font-weight: 500;
        }
        .skills-counter span { color: #5EEAD4; font-weight: 600; }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
        }
        /* Scrollbar */
        .skills-grid::-webkit-scrollbar { width: 4px; }
        .skills-grid::-webkit-scrollbar-track { background: transparent; }
        .skills-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* Skill checkbox item */
        .skill-item {
            position: relative;
            display: flex; align-items: center; gap: 8px;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.22s;
            background: rgba(255,255,255,0.02);
            user-select: none;
        }
        .skill-item:hover {
            border-color: rgba(94,234,212,0.3);
            background: rgba(94,234,212,0.05);
        }
        .skill-item input[type="checkbox"] { display: none; }

        .skill-box {
            width: 16px; height: 16px; border-radius: 5px; flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.03);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #5EEAD4; font-weight: 700;
            transition: all 0.2s;
        }
        .skill-item.checked .skill-box {
            background: rgba(94,234,212,0.15);
            border-color: #5EEAD4;
        }
        .skill-item.checked {
            border-color: rgba(94,234,212,0.35);
            background: rgba(94,234,212,0.06);
        }

        .skill-name {
            font-size: 13px; color: rgba(255,255,255,0.5); font-weight: 400;
            transition: color 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .skill-item.checked .skill-name { color: rgba(255,255,255,0.85); }
        .skill-item:hover .skill-name { color: rgba(255,255,255,0.75); }

        /* No results */
        .no-results {
            grid-column: 1/-1; text-align: center;
            padding: 1.5rem; color: rgba(255,255,255,0.25); font-size: 13px;
        }

        /* Submit */
        button[type="submit"] {
            width: 100%; padding: 14px;
            border-radius: 11px; border: none;
            font-size: 15px; font-weight: 600;
            font-family: 'DM Sans', Arial, sans-serif;
            cursor: pointer; margin-top: 0.5rem;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            background: linear-gradient(135deg, #5EEAD4, #7DD3FC);
            color: #071a2e;
            box-shadow: 0 8px 24px rgba(94,234,212,0.18);
        }
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(94,234,212,0.28);
        }
        button[type="submit"]:active { transform: translateY(0); }

        /* Login link */
        .login-hint {
            text-align: center; margin-top: 1.5rem;
            font-size: 13.5px; color: rgba(255,255,255,0.28); font-weight: 300;
            opacity: 0; transform: translateY(8px);
            animation: fadeUp 0.5s ease 0.3s forwards;
        }
        .login-hint a { color: #5EEAD4; text-decoration: none; font-weight: 500; }
        .login-hint a:hover { opacity: 0.65; }

        @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

        @media (max-width: 500px) {
            .field-row { grid-template-columns: 1fr; }
            .card-header, .card-body { padding-left: 1.5rem; padding-right: 1.5rem; }
            .skills-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div class="page-wrap">

    <!-- Header -->
    <div class="page-header">
        <a th:href="@{/}" class="logo">
            <div class="logo-icon">⚡</div>
            <span class="logo-text">SkillMatch</span>
        </a>
        <div class="step-indicator">
            <div class="step-dot active"></div>
            <div class="step-dot active"></div>
            <div class="step-dot"></div>
            Hesap oluştur
        </div>
    </div>

    <!-- Card -->
    <div class="card">
        <div class="card-header">
            <div class="role-tag">
                <div class="role-tag-dot"></div>
                <span>Job Seeker</span>
            </div>
            <h1>Hesabını oluştur</h1>
            <p>Yeteneklerini seç, sana en uygun işleri biz bulalım.</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="card-body">

            <!-- Hata mesajı — mevcut ${error} yapısı korundu -->
            <div class="error" th:if="${error}" th:text="${error}"></div>

            <!-- th:action="/register" — mevcut yapı korundu -->
            <form method="post" th:action="@{/register}" id="registerForm">

                <div class="section-title">Kişisel Bilgiler</div>

                <!-- Ad Soyad — mevcut name="name" korundu -->
                <div class="field">
                    <label for="name">Ad Soyad</label>
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" id="name" name="name" placeholder="Adınız Soyadınız" required/>
                    </div>
                </div>

                <div class="field-row">
                    <!-- Email — mevcut name="email" korundu -->
                    <div class="field">
                        <label for="email">E-posta</label>
                        <div class="input-wrap">
                            <span class="input-icon">✉</span>
                            <input type="email" id="email" name="email" placeholder="ornek@mail.com" required/>
                        </div>
                    </div>
                    <!-- Şifre — mevcut name="password" korundu -->
                    <div class="field">
                        <label for="password">Şifre</label>
                        <div class="input-wrap">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" name="password" placeholder="••••••••" required/>
                        </div>
                    </div>
                </div>

                <div class="section-title">Yeteneklerini Seç</div>

                <!-- Skills — mevcut th:each, name="skillIds", th:value="${skill.id}" korundu -->
                <div class="skills-section">
                    <div class="skills-search input-wrap">
                        <span class="input-icon">🔍</span>
                        <input type="text" id="skill-search" placeholder="Yetenek ara... (Java, Python, Docker...)" oninput="filterSkills(this.value)" autocomplete="off"/>
                        <span class="skills-counter"><span id="checked-count">0</span> seçildi</span>
                    </div>

                    <div class="skills-grid" id="skills-grid">
                        <!--
                            Thymeleaf th:each ile render edilir.
                            Her .skill-item'a onclick="toggleSkill(this)" eklendi,
                            mevcut name="skillIds" ve th:value="${skill.id}" korundu.
                        -->
                        <label class="skill-item"
                               th:each="skill : ${skills}"
                               th:id="${'label-' + skill.id}"
                               th:data-name="${skill.name}"
                               onclick="toggleSkill(this)">
                            <input type="checkbox"
                                   name="skillIds"
                                   th:value="${skill.id}"
                                   th:id="${'skill-' + skill.id}"/>
                            <div class="skill-box" th:id="${'box-' + skill.id}"></div>
                            <span class="skill-name" th:text="${skill.name}">Yetenek</span>
                        </label>
                    </div>
                </div>

                <button type="submit">Kayıt Ol →</button>
            </form>

        </div>
    </div>

    <div class="login-hint">
        Zaten hesabın var mı? <a th:href="@{/login}">Giriş Yap</a>
    </div>

</div>

<script>
    let checkedCount = 0;
    const totalSkills = document.querySelectorAll('.skill-item').length;

    function toggleSkill(label) {
        const cb = label.querySelector('input[type="checkbox"]');
        cb.checked = !cb.checked;
        if (cb.checked) {
            label.classList.add('checked');
            checkedCount++;
        } else {
            label.classList.remove('checked');
            checkedCount--;
        }
        document.getElementById('checked-count').textContent = checkedCount;
        updateProgress();
    }

    function updateProgress() {
        // İlerleme: form alanlarının doluluk oranı
        const name  = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const pass  = document.getElementById('password').value;
        const infoScore   = ((name ? 1 : 0) + (email ? 1 : 0) + (pass ? 1 : 0)) / 3 * 50;
        const skillScore  = Math.min(checkedCount / 3, 1) * 50; // 3 yetenek = %50
        document.getElementById('progress-fill').style.width = (infoScore + skillScore) + '%';
    }

    function filterSkills(query) {
        const q = query.toLowerCase().trim();
        const items = document.querySelectorAll('.skill-item');
        let visible = 0;
        items.forEach(item => {
            const name = (item.dataset.name || item.querySelector('.skill-name').textContent).toLowerCase();
            const match = !q || name.includes(q);
            item.style.display = match ? '' : 'none';
            if (match) visible++;
        });
        // No results
        const existing = document.getElementById('no-results');
        if (existing) existing.remove();
        if (visible === 0) {
            const msg = document.createElement('div');
            msg.id = 'no-results';
            msg.className = 'no-results';
            msg.textContent = '"' + query + '" için sonuç bulunamadı';
            document.getElementById('skills-grid').appendChild(msg);
        }
    }

    // Progress'i input olaylarına bağla
    ['name','email','password'].forEach(id => {
        document.getElementById(id)?.addEventListener('input', updateProgress);
    });
</script>
</body>
</html>
