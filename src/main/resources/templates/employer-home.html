<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SkillMatch - İşveren Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #080c14;
            color: #f0f4f8;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .navbar {
            height: 60px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 2rem;
            background: #0f172a;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .nav-logo {
            display: flex; align-items: center; gap: 8px;
            text-decoration: none; color: white;
        }
        .nav-logo-icon {
            width: 28px; height: 28px; border-radius: 8px;
            background: linear-gradient(135deg, #7DD3FC, #818CF8);
            display: flex; align-items: center; justify-content: center;
        }
        .nav-center { font-size: 13px; color: rgba(255,255,255,0.6); }
        .nav-right { display: flex; gap: 10px; align-items: center; }
        .btn-new-job {
            padding: 7px 16px; border-radius: 8px;
            background: linear-gradient(135deg, #7DD3FC, #818CF8);
            color: #071a2e; text-decoration: none;
            font-size: 13px; font-weight: 600;
        }
        .nav-logout {
            padding: 7px 12px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6); text-decoration: none; font-size: 13px;
        }
        .notif-badge {
            display: flex; gap: 6px; align-items: center;
            padding: 6px 12px; border-radius: 8px;
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.25);
            color: #f59e0b; font-size: 13px;
        }
        .msg-notif-badge {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 14px; border-radius: 8px;
            background: rgba(94,234,212,0.1);
            border: 1px solid rgba(94,234,212,0.25);
            color: #5EEAD4; font-size: 13px; font-weight: 500;
            cursor: pointer; animation: pulse-notif 2s ease-in-out infinite;
        }
        @keyframes pulse-notif { 0%,100%{opacity:1} 50%{opacity:0.6} }

        /* ── PAGE ── */
        .page {
            max-width: 1100px; margin: auto; padding: 2rem;
            display: grid; grid-template-columns: 260px 1fr; gap: 2rem;
        }

        /* ── SIDEBAR ── */
        .sidebar { display: flex; flex-direction: column; gap: 1rem; }
        .sidebar-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 1.4rem;
        }
        .user-avatar {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #7DD3FC, #818CF8);
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-size: 20px; margin-bottom: 10px;
        }
        .user-name { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .stat-box {
            background: rgba(255,255,255,0.05); padding: 10px;
            border-radius: 8px; text-align: center;
        }
        .stat-num { font-family: 'Fraunces', serif; font-size: 20px; color: #7DD3FC; }
        .stat-lbl { font-size: 11px; color: rgba(255,255,255,0.4); }

        /* ── MAIN ── */
        .main { display: flex; flex-direction: column; gap: 1.5rem; }
        .main-header h1 { font-family: 'Fraunces', serif; font-size: 24px; }
        .main-header p { font-size: 13px; color: rgba(255,255,255,0.4); }

        /* ── JOB BLOCK ── */
        .job-block {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px; overflow: hidden;
        }
        .job-block-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .job-block-title { font-family: 'Fraunces', serif; font-size: 18px; }
        .job-block-meta { font-size: 12px; color: rgba(255,255,255,0.4); }
        .btn-delete {
            font-size: 12px; padding: 6px 10px; border-radius: 6px;
            border: 1px solid rgba(239,68,68,0.3);
            color: #ef4444; text-decoration: none;
        }
        .candidate-count {
            padding: 10px 1.5rem; font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .candidate-list {
            padding: 1rem 1.5rem;
            display: flex; flex-direction: column; gap: 8px;
        }
        .candidate-row {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px; padding: 10px;
        }
        .candidate-avatar {
            width: 34px; height: 34px; border-radius: 8px;
            background: #1e293b; display: flex;
            align-items: center; justify-content: center; font-weight: 600;
        }
        .candidate-info { flex: 1; }
        .candidate-name { font-size: 14px; }
        .candidate-email { font-size: 11px; color: rgba(255,255,255,0.4); }
        .candidate-skills { display: flex; gap: 5px; flex-wrap: wrap; }
        .c-skill {
            font-size: 11px; padding: 2px 8px; border-radius: 100px;
            background: rgba(125,211,252,0.1);
            border: 1px solid rgba(125,211,252,0.2);
        }
        .no-candidates {
            text-align: center; font-size: 13px;
            color: rgba(255,255,255,0.3); padding: 1rem;
        }

        /* ── CHAT BTN ── */
        .chat-btn {
            background: rgba(125,211,252,0.08);
            border: 1px solid rgba(125,211,252,0.2);
            border-radius: 8px; color: #7DD3FC;
            padding: 6px 12px; cursor: pointer;
            font-size: 13px; flex-shrink: 0; transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
        }
        .chat-btn:hover { background: rgba(125,211,252,0.15); }

        /* ── CHAT DRAWER ── */
        .chat-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.45); backdrop-filter: blur(4px);
            z-index: 200;
        }
        .chat-drawer {
            display: none; position: fixed; top: 0; right: 0; bottom: 0;
            width: 400px; background: #0d1526;
            border-left: 1px solid rgba(255,255,255,0.08);
            z-index: 201; flex-direction: column;
            font-family: 'DM Sans', sans-serif;
        }
        .drawer-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.02);
        }
        .drawer-header-sub { font-size: 11px; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
        .drawer-header-name { font-family: 'Fraunces', serif; font-size: 1.1rem; color: #fff; }
        .drawer-close {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: rgba(255,255,255,0.5);
            padding: 6px 11px; cursor: pointer; font-size: 14px;
        }
        .drawer-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
        #chat-messages {
            flex: 1; overflow-y: auto; padding: 1.2rem;
            display: flex; flex-direction: column; gap: 10px;
            scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
        }
        .drawer-input-wrap {
            padding: 1rem 1.2rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex; gap: 8px;
        }
        #chat-input {
            flex: 1; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
            padding: 10px 14px; color: #fff; font-size: 13px;
            font-family: 'DM Sans', sans-serif; outline: none;
        }
        #chat-input:focus { border-color: rgba(125,211,252,0.35); }
        #chat-input::placeholder { color: rgba(255,255,255,0.25); }
        .send-btn {
            padding: 10px 18px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #7DD3FC, #818CF8);
            color: #071a2e; font-weight: 600; cursor: pointer; font-size: 13px;
            font-family: 'DM Sans', sans-serif;
        }
        .send-btn:hover { opacity: 0.88; }

        @media (max-width: 800px) { .page { grid-template-columns: 1fr; } }
        @media (max-width: 500px) { .chat-drawer { width: 100%; } }
    </style>
</head>
<body>

<!-- Employer id → JS -->
<div id="current-user-id" th:attr="data-id=${employer.id}" style="display:none"></div>

<!-- NAVBAR -->
<nav class="navbar">
    <a th:href="@{/employer/home}" class="nav-logo">
        <div class="nav-logo-icon">⚡</div>
        <span>SkillMatch</span>
    </a>
    <div class="nav-center">
        Merhaba <strong th:text="${employer.name}"></strong>
    </div>
    <div class="nav-right">
        </div>
        <div id="msg-notif" class="msg-notif-badge" style="display:none" onclick="openLastChat()">
            💬 <span id="msg-notif-count">0</span> yeni mesaj
        </div>
        <a th:href="@{/employer/job/new}" class="btn-new-job">+ Yeni İlan</a>
        <a th:href="@{/logout}" class="nav-logout">Çıkış</a>
    </div>
</nav>

<div class="page">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-card">
            <div class="user-avatar">🏢</div>
            <div class="user-name" th:text="${employer.name}"></div>
        </div>
        <div class="sidebar-card">
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-num" th:text="${myJobs.size()}"></div>
                    <div class="stat-lbl">İlan</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" th:text="${totalCandidates}"></div>
                    <div class="stat-lbl">Aday</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <div class="main-header">
            <h1>İlanlarım</h1>
            <p>Aday başvurularını görüntüleyin</p>
        </div>

        <div th:if="${jobApplicationMap.isEmpty()}" class="no-candidates">
            Henüz ilan oluşturmadınız
        </div>

        <div th:each="entry : ${jobApplicationMap}"
             th:with="job=${entry.key}, applications=${entry.value}"
             class="job-block">

            <div class="job-block-header">
                <div>
                    <div class="job-block-title" th:text="${job.title}"></div>
                    <div class="job-block-meta" th:text="${job.company + ' · ' + job.location}"></div>
                </div>
                <a class="btn-delete"
                   th:href="@{/employer/job/delete/{id}(id=${job.id})}"
                   onclick="return confirm('Bu ilanı silmek istediğinize emin misiniz?')">
                    Sil
                </a>
            </div>

            <div class="candidate-count">
                <strong th:text="${applications.size()}"></strong> başvuru alındı
            </div>

            <div class="candidate-list">

                <div th:if="${applications.isEmpty()}" class="no-candidates">
                    Henüz başvuru yok
                </div>

                <div th:each="app : ${applications}" class="candidate-row">

                    <div class="candidate-avatar"
                         th:text="${#strings.substring(app.seeker.name, 0, 1)}"></div>

                    <div class="candidate-info">
                        <div class="candidate-name" th:text="${app.seeker.name}"></div>
                        <div class="candidate-email" th:text="${app.seeker.email}"></div>
                    </div>

                    <div class="candidate-skills">
                        <span class="c-skill"
                              th:each="skill : ${app.seeker.skills}"
                              th:text="${skill.name}"></span>
                    </div>

                    <div style="font-size:11px; color:rgba(255,255,255,0.3); flex-shrink:0;">
                        <span th:text="${#temporals.format(app.appliedAt, 'dd.MM HH:mm')}"></span>
                    </div>

                    <button class="chat-btn"
                            th:attr="data-appid=${app.id},data-name=${app.seeker.name}"
                            onclick="openChat(this)">
                        💬 Mesaj
                    </button>

                </div>

            </div>

        </div>

    </main>
</div>

<!-- CHAT DRAWER -->
<div class="chat-overlay" id="chat-overlay" onclick="closeChat()"></div>

<div class="chat-drawer" id="chat-drawer">
    <div class="drawer-header">
        <div>
            <div class="drawer-header-sub">Mesajlaşma</div>
            <div class="drawer-header-name" id="chat-title">—</div>
        </div>
        <button class="drawer-close" onclick="closeChat()">✕</button>
    </div>
    <div id="chat-messages"></div>
    <div class="drawer-input-wrap">
        <input id="chat-input" type="text" placeholder="Mesaj yazın..."
               onkeydown="if(event.key==='Enter') sendMsg()"/>
        <button class="send-btn" onclick="sendMsg()">Gönder</button>
    </div>
</div>

<script>
    var currentUserId = parseInt(document.getElementById('current-user-id').getAttribute('data-id'));
    var currentAppId  = null;

    function loadUnreadCount() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/chat/unread-count', true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                var data  = JSON.parse(xhr.responseText);
                var badge = document.getElementById('msg-notif');
                if (data.count > 0) {
                    document.getElementById('msg-notif-count').textContent = data.count;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            }
        };
        xhr.send();
    }

    loadUnreadCount();
    setInterval(loadUnreadCount, 30000);

    function openChat(btn) {
        currentAppId = btn.getAttribute('data-appid');
        document.getElementById('chat-title').textContent = btn.getAttribute('data-name');
        document.getElementById('chat-overlay').style.display = 'block';
        var drawer = document.getElementById('chat-drawer');
        drawer.style.display = 'flex';
        loadMessages();
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/chat/' + currentAppId + '/read', true);
        xhr.onload = function() { loadUnreadCount(); };
        xhr.send();
    }

    function closeChat() {
        document.getElementById('chat-drawer').style.display = 'none';
        document.getElementById('chat-overlay').style.display = 'none';
        currentAppId = null;
    }

    function loadMessages() {
        var box = document.getElementById('chat-messages');
        box.textContent = '';
        var loading = document.createElement('div');
        loading.style.cssText = 'text-align:center;padding:2rem;font-size:13px;color:rgba(255,255,255,0.2);';
        loading.textContent = 'Yükleniyor...';
        box.appendChild(loading);

        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/chat/' + currentAppId + '/messages', true);
        xhr.onload = function() {
            box.textContent = '';
            if (xhr.status === 200) {
                var msgs = JSON.parse(xhr.responseText);
                if (msgs.length === 0) {
                    var empty = document.createElement('div');
                    empty.style.cssText = 'text-align:center;padding:2rem;font-size:13px;color:rgba(255,255,255,0.2);font-style:italic;';
                    empty.textContent = 'Henüz mesaj yok. İlk mesajı siz gönderin! 👋';
                    box.appendChild(empty);
                } else {
                    for (var i = 0; i < msgs.length; i++) appendMessage(msgs[i]);
                    box.scrollTop = box.scrollHeight;
                }
            }
        };
        xhr.send();
    }

    function appendMessage(m) {
        var box    = document.getElementById('chat-messages');
        var isMine = (m.senderId == currentUserId);

        var wrap = document.createElement('div');
        wrap.style.cssText = 'display:flex;flex-direction:column;margin-bottom:6px;align-items:' + (isMine ? 'flex-end' : 'flex-start') + ';';

        var bubble = document.createElement('div');
        bubble.textContent = m.content;
        bubble.style.cssText = 'max-width:75%;padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.5;color:#f0f4f8;' +
            (isMine
                ? 'background:linear-gradient(135deg,rgba(125,211,252,0.2),rgba(129,140,248,0.2));border:1px solid rgba(125,211,252,0.25);border-bottom-right-radius:4px;'
                : 'background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-bottom-left-radius:4px;');

        var meta = document.createElement('div');
        meta.style.cssText = 'font-size:10px;color:rgba(255,255,255,0.25);margin-top:3px;';
        var time = m.sentAt ? m.sentAt.substring(11, 16) : '';
        meta.textContent = m.senderName + ' · ' + time;

        wrap.appendChild(bubble);
        wrap.appendChild(meta);
        box.appendChild(wrap);
    }

    function sendMsg() {
        var input   = document.getElementById('chat-input');
        var content = input.value.trim();
        if (!content || !currentAppId) return;
        input.value = '';

        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/chat/' + currentAppId + '/send', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.onload = function() {
            if (xhr.status === 200) {
                var msg = JSON.parse(xhr.responseText);
                var box = document.getElementById('chat-messages');
                appendMessage(msg);
                box.scrollTop = box.scrollHeight;
            }
        };
        xhr.send(JSON.stringify({ content: content }));
    }
    function openLastChat() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/chat/last-application', true);
    xhr.onload = function() {
        if (xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);
            if (data.appId) {
                currentAppId = data.appId;
                document.getElementById('chat-title').textContent = data.name;
                document.getElementById('chat-overlay').style.display = 'block';
                var drawer = document.getElementById('chat-drawer');
                drawer.style.display = 'flex';
                drawer.classList.add('open');
                loadMessages();
                var xhr2 = new XMLHttpRequest();
                xhr2.open('POST', '/chat/' + currentAppId + '/read', true);
                xhr2.onload = function() { loadUnreadCount(); };
                xhr2.send();
            }
        }
    };
    xhr.send();
}
</script>

</body>
</html>
